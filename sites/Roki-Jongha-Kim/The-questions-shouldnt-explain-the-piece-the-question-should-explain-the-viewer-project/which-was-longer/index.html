<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Which was longer?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }

    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
    }

    #specks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
    }

    body.idle:not(.asking),
    body.idle:not(.asking) * {
      cursor: none !important;
    }

    #ask {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    body.asking #ask {
      opacity: 1;
      pointer-events: auto;
    }

    #ask .inner {
      width: min(22rem, 100%);
      color: rgba(232, 228, 220, 0.55);
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.7;
    }

    #ask .inner[hidden] {
      display: none;
    }

    #ask p {
      margin-bottom: 1.35rem;
    }

    .choices {
      display: flex;
      gap: 2.5rem;
    }

    button {
      appearance: none;
      border: none;
      background: none;
      color: rgba(232, 228, 220, 0.42);
      font: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 0;
    }

    button:hover,
    button:focus {
      color: rgba(232, 228, 220, 0.88);
      outline: none;
    }

    #reveal p {
      margin-bottom: 0.45rem;
      color: rgba(232, 228, 220, 0.62);
    }
  </style>
</head>
<body>
  <div id="field" aria-hidden="true"></div>
  <canvas id="specks" aria-hidden="true"></canvas>

  <div id="ask">
    <div class="inner" id="step-choose">
      <p>Which was longer?</p>
      <div class="choices">
        <button type="button" data-choice="a">A</button>
        <button type="button" data-choice="b">B</button>
      </div>
    </div>
    <div class="inner" id="step-sure" hidden>
      <p>Are you sure?</p>
      <div class="choices">
        <button type="button" data-sure="yes">Yes</button>
        <button type="button" data-sure="no">No</button>
      </div>
    </div>
    <div class="inner" id="step-reveal" hidden>
      <p id="line-a"></p>
      <p id="line-b"></p>
    </div>
  </div>

  <script>
    // ============================================================
    //  WHICH WAS LONGER?
    //  Memory of duration. Equal on some visits. Not on others.
    //
    //  HOW TO EXPERIMENT (look for the ★ markers below):
    //    ★ 1. Field color
    //    ★ 2. Duration pairs (ms)
    //    ★ 3. Black gap between A and B
    //    ★ 4. Subtle events in B
    // ============================================================


    // ------------------------------------------------------------
    // ★ 1. FIELD
    //
    // Violet in A (still). Same violet in B, with tiny magenta events.
    // ------------------------------------------------------------
    const restColor = { r: 62, g: 22, b: 92 };
    const brightColor = { r: 118, g: 36, b: 118 };
    const dimColor = { r: 42, g: 14, b: 72 };


    // ------------------------------------------------------------
    // ★ 2. PAIRS
    //
    // Each visit picks one. Equal often enough that “they’re always
    // the same” is not a lesson they can learn. Values in ms.
    // ------------------------------------------------------------
    const PAIRS = [
      { a: 22000, b: 22000 }, // 0:22 / 0:22
      { a: 17000, b: 28000 }, // 0:17 / 0:28
      { a: 27000, b: 16000 }, // 0:27 / 0:16
      { a: 24000, b: 24000 }, // 0:24 / 0:24
      { a: 19000, b: 26000 }, // 0:19 / 0:26
      { a: 28000, b: 18000 }, // 0:28 / 0:18
      { a: 21000, b: 21000 }, // 0:21 / 0:21
      { a: 15000, b: 29000 }, // 0:15 / 0:29
    ];


    // ------------------------------------------------------------
    // ★ 3. BLACK
    //
    // The cut between A and B. Long enough to be a boundary,
    // short enough not to become a third duration.
    // ------------------------------------------------------------
    const blackMs = 2000;


    // ------------------------------------------------------------
    // ★ 4. B EVENTS
    // ------------------------------------------------------------
    const SOUND = { masterGain: 0.035 };


    // ============================================================
    // Below this line: the engine. You usually won’t need to edit it.
    // ============================================================


    const field = document.getElementById("field");
    const canvas = document.getElementById("specks");
    const ctx = canvas.getContext("2d");
    const stepChoose = document.getElementById("step-choose");
    const stepSure = document.getElementById("step-sure");
    const stepReveal = document.getElementById("step-reveal");

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function rgbToCss(rgb) {
      return "rgb(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ")";
    }

    function setField(rgb) {
      field.style.backgroundColor = rgbToCss(rgb);
    }

    function formatStamp(ms) {
      const total = Math.max(0, Math.round(ms / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return minutes + ":" + String(seconds).padStart(2, "0");
    }

    function pickPair() {
      const key = "which-was-longer-last";
      let last = parseInt(localStorage.getItem(key), 10);
      if (isNaN(last)) last = -1;
      let index = Math.floor(Math.random() * PAIRS.length);
      if (index === last) index = (index + 1) % PAIRS.length;
      try { localStorage.setItem(key, String(index)); } catch (e) {}
      return PAIRS[index];
    }

    const pair = pickPair();
    let phase = "a"; // a | black | b | choose | sure | reveal
    let choice = null;


    // --- Canvas -------------------------------------------------

    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
    }

    window.addEventListener("resize", sizeCanvas);
    sizeCanvas();

    function drawSpeck() {
      if (phase !== "b") return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const size = Math.random() < 0.85 ? 1 : 2;
      const x = Math.floor(rand(0, w - size));
      const y = Math.floor(rand(0, h - size));
      ctx.fillStyle = Math.random() < 0.55
        ? "rgba(255, 90, 180, 0.55)"
        : "rgba(210, 170, 255, 0.5)";
      ctx.fillRect(x, y, size, size);
      window.setTimeout(function () {
        ctx.clearRect(x - 1, y - 1, size + 2, size + 2);
      }, rand(40, 160));
    }

    function flashField() {
      if (phase !== "b") return;
      const dim = Math.random() < 0.4;
      setField(dim ? dimColor : brightColor);
      window.setTimeout(function () {
        if (phase === "b") setField(restColor);
      }, rand(70, 180));
    }


    // --- Sound (B only) -----------------------------------------

    let audioCtx = null;
    let master = null;
    let audioBuilt = false;

    function ensureSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (audioBuilt || audioCtx.state !== "running") return;

      audioBuilt = true;
      master = audioCtx.createGain();
      master.gain.value = SOUND.masterGain;
      master.connect(audioCtx.destination);
    }

    function playQuiet() {
      if (phase !== "b" || !master || !audioCtx || audioCtx.state !== "running") return;
      const now = audioCtx.currentTime;
      const r = Math.random();

      if (r < 0.55) {
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = rand(900, 1800);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.4, now + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + 0.05);
      } else {
        const length = Math.max(1, Math.floor(audioCtx.sampleRate * 0.04));
        const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (var i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 1600;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.55, now + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
        src.connect(filter);
        filter.connect(g);
        g.connect(master);
        src.start(now);
        src.stop(now + 0.04);
      }
    }

    function runBEvent() {
      if (phase !== "b") return;
      const r = Math.random();
      if (r < 0.4) drawSpeck();
      else if (r < 0.75) flashField();
      else playQuiet();
    }

    let bTimer = null;

    function scheduleB(endAt) {
      function next() {
        if (phase !== "b") return;
        const remaining = endAt - performance.now();
        if (remaining < 900) return;
        runBEvent();
        const gap = rand(1400, 4200);
        bTimer = window.setTimeout(next, Math.min(gap, remaining - 400));
      }
      bTimer = window.setTimeout(next, rand(700, 2200));
    }


    // --- Sequence -----------------------------------------------

    function goBlack() {
      phase = "black";
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      setField({ r: 0, g: 0, b: 0 });
      window.setTimeout(startB, blackMs);
    }

    function startB() {
      phase = "b";
      setField(restColor);
      ensureSound();
      const endAt = performance.now() + pair.b;
      scheduleB(endAt);
      window.setTimeout(beginAsking, pair.b);
    }

    function beginAsking() {
      if (phase !== "b") return;
      phase = "choose";
      clearTimeout(bTimer);
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      setField(restColor);
      document.body.classList.remove("idle");
      document.body.classList.add("asking");
    }

    function showStep(name) {
      stepChoose.hidden = name !== "choose";
      stepSure.hidden = name !== "sure";
      stepReveal.hidden = name !== "reveal";
    }

    document.querySelectorAll("[data-choice]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (phase !== "choose") return;
        choice = btn.getAttribute("data-choice");
        phase = "sure";
        showStep("sure");
      });
    });

    document.querySelector("[data-sure='no']").addEventListener("click", function () {
      if (phase !== "sure") return;
      choice = null;
      phase = "choose";
      showStep("choose");
    });

    document.querySelector("[data-sure='yes']").addEventListener("click", function () {
      if (phase !== "sure") return;
      phase = "reveal";
      document.getElementById("line-a").textContent = "A — " + formatStamp(pair.a);
      document.getElementById("line-b").textContent = "B — " + formatStamp(pair.b);
      showStep("reveal");
    });

    setField(restColor);
    window.setTimeout(goBlack, pair.a);

    ["pointerdown", "keydown", "touchstart"].forEach(function (evt) {
      window.addEventListener(evt, function () {
        if (phase === "a" || phase === "b" || phase === "black") ensureSound();
      }, { passive: true });
    });


    // --- Hide cursor after inactivity ---------------------------

    const IDLE_MS = 3000;
    let idleTimer = null;

    function markActive() {
      if (phase === "choose" || phase === "sure" || phase === "reveal") return;
      document.body.classList.remove("idle");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        if (phase === "a" || phase === "black" || phase === "b") {
          document.body.classList.add("idle");
        }
      }, IDLE_MS);
    }

    ["mousemove", "mousedown", "keydown", "touchstart", "pointerdown"].forEach(
      function (evt) {
        window.addEventListener(evt, markActive, { passive: true });
      }
    );
    markActive();


    console.info("Which was longer?");
  </script>
</body>
</html>

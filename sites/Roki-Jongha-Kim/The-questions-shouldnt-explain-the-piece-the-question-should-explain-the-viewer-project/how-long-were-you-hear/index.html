<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> </title>
  <style>
    /*
      Full-viewport color field.
      No UI, no borders, no scrollbars — just light filling the window
      until the piece asks.
    */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000; /* brief flash-prevention before JS paints the first color */
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }

    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      /* solid color only — never a gradient */
      background-color: rgb(0, 0, 0);
    }

    /* Cursor is hidden via the .idle class after a few seconds of no input */
    body.idle:not(.asking),
    body.idle:not(.asking) * {
      cursor: none !important;
    }

    #ask {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease;
    }

    body.asking #ask {
      opacity: 1;
      pointer-events: auto;
    }

    #ask .inner {
      width: min(28rem, 100%);
      color: rgba(232, 228, 220, 0.52);
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.55;
    }

    #ask p {
      margin-bottom: 1.25rem;
    }

    #ask form {
      display: grid;
      gap: 1rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem 1.75rem;
      align-items: baseline;
    }

    label {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      font-size: 0.82rem;
      color: rgba(232, 228, 220, 0.4);
    }

    input {
      appearance: none;
      width: 3.2rem;
      border: none;
      border-bottom: 1px solid rgba(232, 228, 220, 0.22);
      background: transparent;
      color: rgba(232, 228, 220, 0.75);
      caret-color: rgba(232, 228, 220, 0.7);
      font: inherit;
      font-size: 0.95rem;
      padding: 0.15rem 0.1rem;
      outline: none;
      border-radius: 0;
    }

    input:focus {
      border-bottom-color: rgba(232, 228, 220, 0.55);
    }

    button {
      appearance: none;
      border: none;
      background: none;
      color: rgba(232, 228, 220, 0.38);
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      cursor: pointer;
      padding: 0;
      width: fit-content;
    }

    button:hover {
      color: rgba(232, 228, 220, 0.72);
    }

    #reveal {
      display: none;
    }

    body.revealed form {
      display: none;
    }

    body.revealed #reveal {
      display: block;
    }

    #reveal .actual {
      color: rgba(232, 228, 220, 0.78);
    }
  </style>
</head>
<body>
  <div id="field" aria-hidden="true"></div>

  <div id="ask">
    <div class="inner">
      <form id="guess" autocomplete="off">
        <p>How long were you here?</p>
        <div class="row">
          <label>
            <input name="minutes" inputmode="numeric" maxlength="3" aria-label="minutes" />
            minutes
          </label>
          <label>
            <input name="seconds" inputmode="numeric" maxlength="3" aria-label="seconds" />
            seconds
          </label>
        </div>
        <button type="submit">ok</button>
      </form>
      <div id="reveal"></div>
    </div>
  </div>

  <script>
    // ============================================================
    //  HOW LONG WERE YOU HERE?
    //  Time as the material. No clock until they leave.
    //
    //  HOW TO EXPERIMENT (look for the ★ markers below):
    //    ★ 1. Resting / drift colors
    //    ★ 2. How slowly the field changes
    //    ★ 3. Sound
    // ============================================================


    // ------------------------------------------------------------
    // ★ 1. COLORS
    //
    // Deep indigo. The drift is only a few RGB values toward violet,
    // slow enough that it cannot be used as a clock.
    // ------------------------------------------------------------
    const startColor = { r: 18, g: 12, b: 48 };
    const endColor   = { r: 28, g: 16, b: 62 };


    // ------------------------------------------------------------
    // ★ 2. DRIFT
    //
    // One-way. No loop. 18 minutes to arrive, then it holds.
    // ------------------------------------------------------------
    const driftDuration = 1080000;


    // ------------------------------------------------------------
    // ★ 3. SOUND
    //
    // Tranquil drone. Starts as soon as the page allows it.
    // Many browsers still wait for a click; that first gesture
    // only unlocks audio — it does not end the piece.
    // ------------------------------------------------------------
    const SOUND = {
      masterGain: 0.12,
      fadeInSeconds: 5,
      breathPeriodSeconds: 67,
      breathDepth: 0.12,
      oscillators: [
        { frequency: 43.65, type: "sine", gain: 0.55 },
        { frequency: 65.41, type: "sine", gain: 0.42 },
        { frequency: 87.31, type: "sine", gain: 0.28 },
        { frequency: 130.8, type: "sine", gain: 0.16 },
        { frequency: 196.0, type: "sine", gain: 0.1 },
      ],
      filterFrequency: 920,
      filterQ: 0.4,
    };


    // ============================================================
    // Below this line: the engine. You usually won’t need to edit it.
    // ============================================================


    const field = document.getElementById("field");
    const guessForm = document.getElementById("guess");
    const reveal = document.getElementById("reveal");

    const arrivedAt = performance.now();
    const arrivedWall = Date.now();
    let endedAt = null;
    let phase = "running"; // running | asking | revealed
    let audioStarted = false;
    let audioStartedAt = 0;
    let audioBuilt = false;


    function srgbChannelToLinear(c) {
      const x = c / 255;
      return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    }

    function linearToSrgbChannel(c) {
      const x = c <= 0.0031308
        ? 12.92 * c
        : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
      return Math.min(255, Math.max(0, Math.round(x * 255)));
    }

    function rgbToOklab(rgb) {
      const r = srgbChannelToLinear(rgb.r);
      const g = srgbChannelToLinear(rgb.g);
      const b = srgbChannelToLinear(rgb.b);
      const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
      const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
      const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
      const l_ = Math.cbrt(l);
      const m_ = Math.cbrt(m);
      const s_ = Math.cbrt(s);
      return {
        L: 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
        a: 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
        b: 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_,
      };
    }

    function oklabToRgb(lab) {
      const l_ = lab.L + 0.3963377774 * lab.a + 0.2158037573 * lab.b;
      const m_ = lab.L - 0.1055613458 * lab.a - 0.0638541728 * lab.b;
      const s_ = lab.L - 0.0894841775 * lab.a - 1.2914855480 * lab.b;
      const l = l_ * l_ * l_;
      const m = m_ * m_ * m_;
      const s = s_ * s_ * s_;
      const r = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      const g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      const b = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
      return {
        r: linearToSrgbChannel(r),
        g: linearToSrgbChannel(g),
        b: linearToSrgbChannel(b),
      };
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(t) {
      const x = Math.min(1, Math.max(0, t));
      return x * x * (3 - 2 * x);
    }

    function interpolateColor(startRgb, endRgb, t) {
      const start = rgbToOklab(startRgb);
      const end = rgbToOklab(endRgb);
      return oklabToRgb({
        L: lerp(start.L, end.L, t),
        a: lerp(start.a, end.a, t),
        b: lerp(start.b, end.b, t),
      });
    }

    function rgbToCss(rgb) {
      return "rgb(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ")";
    }

    function setFieldColor(rgb) {
      field.style.backgroundColor = rgbToCss(rgb);
    }

    setFieldColor(startColor);

    let lastPainted = { r: -1, g: -1, b: -1 };
    let driftStopped = false;

    function tick(now) {
      if (driftStopped) return;
      const elapsed = now - arrivedAt;
      const t = smoothstep(Math.min(1, elapsed / driftDuration));
      const rgb = interpolateColor(startColor, endColor, t);
      if (rgb.r !== lastPainted.r || rgb.g !== lastPainted.g || rgb.b !== lastPainted.b) {
        setFieldColor(rgb);
        lastPainted = rgb;
      }
      if (elapsed < driftDuration) requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);


    // --- Sound --------------------------------------------------

    let master = null;
    let audioCtx = null;

    function buildSound() {
      if (audioBuilt || !audioCtx) return;
      audioBuilt = true;

      master = audioCtx.createGain();
      master.gain.value = 0;
      master.connect(audioCtx.destination);

      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = SOUND.filterFrequency;
      filter.Q.value = SOUND.filterQ;
      filter.connect(master);

      const breath = audioCtx.createGain();
      breath.gain.value = 1;
      breath.connect(filter);

      const now = audioCtx.currentTime;
      master.gain.setValueAtTime(0, now);
      master.gain.linearRampToValueAtTime(SOUND.masterGain, now + SOUND.fadeInSeconds);

      const lfo = audioCtx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 1 / SOUND.breathPeriodSeconds;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = SOUND.breathDepth;
      lfo.connect(lfoGain);
      lfoGain.connect(breath.gain);
      lfo.start(now);

      SOUND.oscillators.forEach(function (spec) {
        const osc = audioCtx.createOscillator();
        osc.type = spec.type;
        osc.frequency.value = spec.frequency;
        const g = audioCtx.createGain();
        g.gain.value = spec.gain;
        osc.connect(g);
        g.connect(breath);
        osc.start(now);
      });
    }

    // Returns "started" if audio just began, "running" if already playing,
    // "blocked" if the browser is still waiting for a gesture.
    function ensureSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return "blocked";

      if (!audioCtx) {
        audioCtx = new AudioContext();
        buildSound();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume().then(function () {
          if (audioCtx.state === "running" && !audioStarted) {
            audioStarted = true;
            audioStartedAt = Date.now();
          }
        });
      }

      if (audioCtx.state === "running") {
        if (!audioStarted) {
          audioStarted = true;
          audioStartedAt = Date.now();
          return "started";
        }
        return "running";
      }

      return "blocked";
    }

    function hushSound() {
      if (!master || !audioCtx) return;
      const now = audioCtx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(0, now, 0.8);
    }


    // --- Duration language --------------------------------------

    function unit(n, singular, plural) {
      return n + " " + (n === 1 ? singular : plural);
    }

    function formatDuration(ms) {
      const total = Math.max(0, Math.round(ms / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      const parts = [];
      if (hours) parts.push(unit(hours, "hour", "hours"));
      if (minutes) parts.push(unit(minutes, "minute", "minutes"));
      if (seconds || !parts.length) parts.push(unit(seconds, "second", "seconds"));
      if (parts.length === 1) return parts[0];
      if (parts.length === 2) return parts[0] + " and " + parts[1];
      return parts[0] + ", " + parts[1] + ", and " + parts[2];
    }

    function formatGuess(minutes, seconds) {
      const m = Math.max(0, minutes);
      const s = Math.max(0, seconds);
      if (!m && !s) return "";
      return formatDuration((m * 60 + s) * 1000);
    }


    // --- End: ask, then reveal ----------------------------------

    function stayMs() {
      return (endedAt || Date.now()) - arrivedWall;
    }

    function beginAsking() {
      if (phase !== "running") return;
      phase = "asking";
      endedAt = Date.now();
      driftStopped = true;
      hushSound();
      document.body.classList.remove("idle");
      document.body.classList.add("asking");
      const minutes = guessForm.elements.minutes;
      window.setTimeout(function () {
        minutes.focus();
      }, 800);
    }

    function revealActual(guessText) {
      phase = "revealed";
      document.body.classList.add("revealed");
      const actual = formatDuration(stayMs());
      const lines = [];
      if (guessText) {
        lines.push("You thought " + guessText + ".");
      }
      lines.push('<span class="actual">You were here for ' + actual + ".</span>");
      reveal.innerHTML = lines.map(function (line) {
        return "<p>" + line + "</p>";
      }).join("");
    }

    guessForm.addEventListener("submit", function (event) {
      event.preventDefault();
      if (phase !== "asking") return;
      const minutes = parseInt(guessForm.elements.minutes.value, 10) || 0;
      const seconds = parseInt(guessForm.elements.seconds.value, 10) || 0;
      revealActual(formatGuess(minutes, seconds));
    });


    // First gesture: unlock audio if the browser blocked autoplay.
    // Later click / key, or leaving the tab: the piece asks.
    const GRACE_MS = 2500;

    function onGesture(event) {
      if (phase !== "running") return;
      if (event && event.repeat) return;
      if (event && event.key && ["Shift", "Control", "Alt", "Meta", "Tab", "CapsLock"].indexOf(event.key) !== -1) {
        return;
      }

      const status = ensureSound();
      if (status !== "running") return;
      if (Date.now() - audioStartedAt < GRACE_MS) return;
      beginAsking();
    }

    function tryAutoplay() {
      ensureSound();
    }

    tryAutoplay();
    window.addEventListener("pointermove", tryAutoplay, { passive: true });

    ["pointerdown", "keydown", "touchstart"].forEach(function (evt) {
      window.addEventListener(evt, onGesture, { passive: true });
    });

    document.addEventListener("visibilitychange", function () {
      if (phase !== "running") return;
      if (document.hidden) beginAsking();
    });


    // --- Hide cursor after inactivity ---------------------------

    const IDLE_MS = 3000;
    let idleTimer = null;

    function markActive() {
      if (phase !== "running") return;
      document.body.classList.remove("idle");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        if (phase === "running") document.body.classList.add("idle");
      }, IDLE_MS);
    }

    ["mousemove", "mousedown", "keydown", "touchstart", "pointerdown"].forEach(
      function (evt) {
        window.addEventListener(evt, markActive, { passive: true });
      }
    );
    markActive();


    console.info("How long were you here?");
  </script>
</body>
</html>

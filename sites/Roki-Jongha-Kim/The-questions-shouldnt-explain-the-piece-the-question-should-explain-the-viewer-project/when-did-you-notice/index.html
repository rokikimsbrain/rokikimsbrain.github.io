<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>When did you notice?</title>
  <style>
    /*
      Full-viewport color field.
      No UI, no clock — until they mark the moment they noticed.
    */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }

    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: rgb(0, 0, 0);
    }

    #form {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
    }

    body.idle:not(.noticed),
    body.idle:not(.noticed) * {
      cursor: none !important;
    }

    #record {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.6s ease;
    }

    body.noticed #record {
      opacity: 1;
      pointer-events: auto;
    }

    #record .inner {
      width: min(28rem, 100%);
      color: rgba(52, 16, 36, 0.55);
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.7;
    }

    #record p {
      margin-bottom: 0.85rem;
    }

    #began {
      opacity: 0;
      transition: opacity 2s ease;
    }

    body.show-began #began {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="field" aria-hidden="true"></div>
  <canvas id="form" aria-hidden="true"></canvas>

  <div id="record">
    <div class="inner">
      <p id="noticed-line"></p>
      <p id="began">It began at 0:00.</p>
    </div>
  </div>

  <script>
    // ============================================================
    //  WHEN DID YOU NOTICE?
    //  Change begins at 0:00. Awareness is the material.
    //
    //  HOW TO EXPERIMENT (look for the ★ markers below):
    //    ★ 1. Start / end color
    //    ★ 2. How long the accumulation takes
    //    ★ 3. How visible the form is allowed to get
    //    ★ 4. Sound
    // ============================================================


    // ------------------------------------------------------------
    // ★ 1. COLOR
    //
    // Dusty muted pink → luminous pink.
    // The glow arrives so slowly it is easy to miss the moment it began.
    // ------------------------------------------------------------
    const startColor = { r: 168, g: 148, b: 156 };
    const endColor   = { r: 255, g: 150, b: 198 };


    // ------------------------------------------------------------
    // ★ 2. DURATION
    //
    // How long the accumulation takes to fully arrive, then it holds.
    // 60000 ms = 1 minute.
    // ------------------------------------------------------------
    const duration = 60000;


    // ------------------------------------------------------------
    // ★ 3. FORM
    //
    // A barely-visible shape that develops with the color.
    // Even at 1.0 it should be easy to doubt.
    // ------------------------------------------------------------
    const maxOpacity = 0.12;


    // ------------------------------------------------------------
    // ★ 4. SOUND
    //
    // A low tone that starts almost not there and slowly becomes
    // present. Tries to begin at 0:00 (browsers may wait for a click).
    // ------------------------------------------------------------
    const SOUND = {
      startGain: 0.004,
      endGain: 0.11,
      oscillators: [
        { frequency: 46.2, type: "sine", gain: 0.55 },
        { frequency: 69.3, type: "sine", gain: 0.28 },
        { frequency: 92.5, type: "sine", gain: 0.12 },
      ],
      filterStart: 180,
      filterEnd: 520,
      filterQ: 0.45,
    };


    // ============================================================
    // Below this line: the engine. You usually won’t need to edit it.
    // ============================================================


    const field = document.getElementById("field");
    const canvas = document.getElementById("form");
    const ctx = canvas.getContext("2d");
    const noticedLine = document.getElementById("noticed-line");

    const arrivedAt = performance.now();
    const arrivedWall = Date.now();
    let stopped = false;
    let progress = 0;


    function srgbChannelToLinear(c) {
      const x = c / 255;
      return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    }

    function linearToSrgbChannel(c) {
      const x = c <= 0.0031308
        ? 12.92 * c
        : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
      return Math.min(255, Math.max(0, Math.round(x * 255)));
    }

    function rgbToOklab(rgb) {
      const r = srgbChannelToLinear(rgb.r);
      const g = srgbChannelToLinear(rgb.g);
      const b = srgbChannelToLinear(rgb.b);
      const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
      const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
      const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
      const l_ = Math.cbrt(l);
      const m_ = Math.cbrt(m);
      const s_ = Math.cbrt(s);
      return {
        L: 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
        a: 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
        b: 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_,
      };
    }

    function oklabToRgb(lab) {
      const l_ = lab.L + 0.3963377774 * lab.a + 0.2158037573 * lab.b;
      const m_ = lab.L - 0.1055613458 * lab.a - 0.0638541728 * lab.b;
      const s_ = lab.L - 0.0894841775 * lab.a - 1.2914855480 * lab.b;
      const l = l_ * l_ * l_;
      const m = m_ * m_ * m_;
      const s = s_ * s_ * s_;
      const r = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      const g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      const b = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
      return {
        r: linearToSrgbChannel(r),
        g: linearToSrgbChannel(g),
        b: linearToSrgbChannel(b),
      };
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(t) {
      const x = Math.min(1, Math.max(0, t));
      return x * x * (3 - 2 * x);
    }

    function interpolateColor(startRgb, endRgb, t) {
      const start = rgbToOklab(startRgb);
      const end = rgbToOklab(endRgb);
      return oklabToRgb({
        L: lerp(start.L, end.L, t),
        a: lerp(start.a, end.a, t),
        b: lerp(start.b, end.b, t),
      });
    }

    function rgbToCss(rgb) {
      return "rgb(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ")";
    }

    function setFieldColor(rgb) {
      field.style.backgroundColor = rgbToCss(rgb);
    }

    setFieldColor(startColor);


    // --- Form (the barely-visible shape) ------------------------

    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", function () {
      sizeCanvas();
      drawForm(progress);
    });
    sizeCanvas();

    const blob = {
      x: 0.5,
      y: 0.48,
      rx: 0.18,
      ry: 0.24,
    };

    function drawForm(p) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);
      const t = smoothstep(p);
      if (t <= 0) return;

      const cx = w * blob.x;
      const cy = h * blob.y;
      const rx = w * blob.rx * lerp(0.72, 1, t);
      const ry = h * blob.ry * lerp(0.72, 1, t);
      const alpha = t * maxOpacity;
      const radius = Math.max(rx, ry);

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      g.addColorStop(0, "rgba(255, 90, 160, " + alpha + ")");
      g.addColorStop(0.5, "rgba(255, 130, 180, " + alpha * 0.45 + ")");
      g.addColorStop(1, "rgba(168, 148, 156, 0)");

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(rx / radius, ry / radius);
      ctx.translate(-cx, -cy);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
    }


    // --- Sound --------------------------------------------------

    let audioCtx = null;
    let master = null;
    let filter = null;
    let audioBuilt = false;

    function buildSound() {
      if (audioBuilt || !audioCtx) return;
      audioBuilt = true;

      master = audioCtx.createGain();
      master.gain.value = SOUND.startGain;
      master.connect(audioCtx.destination);

      filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = SOUND.filterStart;
      filter.Q.value = SOUND.filterQ;
      filter.connect(master);

      SOUND.oscillators.forEach(function (spec) {
        const osc = audioCtx.createOscillator();
        osc.type = spec.type;
        osc.frequency.value = spec.frequency;
        const g = audioCtx.createGain();
        g.gain.value = spec.gain;
        osc.connect(g);
        g.connect(filter);
        osc.start();
      });
    }

    function scheduleSound(p) {
      if (!master || !audioCtx || audioCtx.state !== "running") return;
      const now = audioCtx.currentTime;
      const t = smoothstep(p);
      master.gain.setTargetAtTime(lerp(SOUND.startGain, SOUND.endGain, t), now, 0.4);
      filter.frequency.setTargetAtTime(lerp(SOUND.filterStart, SOUND.filterEnd, t), now, 0.4);
    }

    function ensureSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioCtx) {
        audioCtx = new AudioContext();
        buildSound();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function hushSound() {
      if (!master || !audioCtx) return;
      const now = audioCtx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(0, now, 0.8);
    }

    ensureSound();
    window.addEventListener("pointermove", ensureSound, { passive: true });


    // --- Accumulation -------------------------------------------

    let lastPainted = { r: -1, g: -1, b: -1 };

    function tick(now) {
      if (stopped) return;
      const elapsed = now - arrivedAt;
      progress = Math.min(1, elapsed / duration);
      const t = smoothstep(progress);
      const rgb = interpolateColor(startColor, endColor, t);

      if (rgb.r !== lastPainted.r || rgb.g !== lastPainted.g || rgb.b !== lastPainted.b) {
        setFieldColor(rgb);
        lastPainted = rgb;
      }

      drawForm(progress);
      scheduleSound(progress);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);


    // --- Notice -------------------------------------------------

    function formatStamp(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return minutes + ":" + String(seconds).padStart(2, "0");
    }

    function markNoticed() {
      if (stopped) return;
      if (Date.now() - arrivedWall < 500) return;
      stopped = true;
      hushSound();
      document.body.classList.remove("idle");
      document.body.classList.add("noticed");
      noticedLine.textContent = "You noticed at " + formatStamp(Date.now() - arrivedWall) + ".";
      window.setTimeout(function () {
        document.body.classList.add("show-began");
      }, 1800);
    }

    function onNotice(event) {
      if (event && event.repeat) return;
      if (event && event.key && ["Shift", "Control", "Alt", "Meta", "Tab", "CapsLock"].indexOf(event.key) !== -1) {
        return;
      }
      ensureSound();
      markNoticed();
    }

    ["pointerdown", "keydown", "touchstart"].forEach(function (evt) {
      window.addEventListener(evt, onNotice, { passive: true });
    });


    // --- Hide cursor after inactivity ---------------------------

    const IDLE_MS = 3000;
    let idleTimer = null;

    function markActive() {
      if (stopped) return;
      document.body.classList.remove("idle");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        if (!stopped) document.body.classList.add("idle");
      }, IDLE_MS);
    }

    ["mousemove", "mousedown", "keydown", "touchstart", "pointerdown"].forEach(
      function (evt) {
        window.addEventListener(evt, markActive, { passive: true });
      }
    );
    markActive();


    console.info("When did you notice?");
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>AI Assumption Face</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #d8d8d8;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #piece {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #d8d8d8;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    #ui {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    #ui > * {
      pointer-events: auto;
    }

    #status {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 88px);
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #888;
      text-transform: uppercase;
      pointer-events: none;
    }

    #remark {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      width: max-content;
      max-width: none;
      white-space: nowrap;
      text-align: center;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0.08em;
      color: #111;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    #remark.show {
      opacity: 1;
    }

    #menu-toggle {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      background:
        linear-gradient(#111, #111) center 12px / 20px 2px no-repeat,
        linear-gradient(#111, #111) center / 20px 2px no-repeat,
        linear-gradient(#111, #111) center 26px / 20px 2px no-repeat;
      cursor: pointer;
    }

    #drawer {
      display: none !important;
      position: absolute;
      top: 60px;
      left: 20px;
      max-width: min(320px, calc(100vw - 40px));
    }

    #drawer.open {
      display: block !important;
    }

    #menu {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 11px;
    }

    #menu button,
    #menu a,
    .sheet p {
      margin: 0;
      border: 0;
      background: none;
      padding: 0;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
      cursor: pointer;
      line-height: 1.45;
    }

    #menu a {
      text-decoration: none;
      color: #888;
    }

    #menu button {
      color: #888;
    }

    #menu button.active,
    #menu a.active {
      color: #111;
    }

    #menu button:hover,
    #menu a:hover {
      color: #111;
    }

    #actions {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 2;
    }

    #actions button {
      border: 1px solid #111;
      background: white;
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }

    #actions button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #camera {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #test {
      position: absolute;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 2;
    }

    #test input {
      width: 180px;
      border: 1px solid #111;
      background: white;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
    }

    #test button {
      border: 1px solid #111;
      background: white;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }

  specularMap.colorSpace = THREE.SRGBColorSpace;

  const morph = {
    uJaw: { value: 1 },
    uFace: { value: 1 },
    uNoseW: { value: 1 },
    uNoseZ: { value: 1 },

    normalScale: new THREE.Vector2(1.15, 1.15)

  material.onBeforeCompile = (shader) => {

    shader.vertexShader = shader.vertexShader.replace(

      uniform float uJaw;
      uniform float uFace;
      uniform float uNoseW;
      uniform float uNoseZ;
      uniform float uBridge;
      uniform float uCheek;
      uniform float uBrow;
      uniform float uEyeH;
      uniform float uEyeX;
      uniform float uChin;
      uniform float uLips;
      uniform float uLong;`

      `#include <begin_vertex>
      vec3 p = transformed;
      float front = smoothstep(0.35, 1.55, p.z);
      p.y = mix(p.y, 1.05 + (p.y - 1.05) * uLong, front * 0.88);

      float jawMask = smoothstep(0.62, -0.45, p.y) * front;
      p.x *= mix(1.0, uJaw, 0.16 + 0.84 * jawMask);

      float mid = smoothstep(-0.25, 0.55, p.y) * smoothstep(2.45, 1.55, p.y) * front;
      p.x *= mix(1.0, uFace, mid * 0.9);

      float nx = 1.0 - smoothstep(0.12, 0.58, abs(p.x));
      float nose = nx * smoothstep(0.78, 1.08, p.y) * smoothstep(1.42, 1.12, p.y) * smoothstep(1.85, 2.28, p.z);
      p.x *= mix(1.0, uNoseW, nose);
      p.z += (uNoseZ - 1.0) * nose * 0.55;

      float bridge = nx * smoothstep(1.28, 1.52, p.y) * smoothstep(1.92, 1.62, p.y) * front;
      p.z += (uBridge - 1.0) * bridge * 0.7;

      float cheek = smoothstep(0.65, 1.15, abs(p.x)) * smoothstep(1.85, 1.28, abs(p.x))
        * smoothstep(0.38, 0.88, p.y) * smoothstep(1.68, 1.18, p.y) * front;
      p.x += sign(p.x + 0.0001) * (uCheek - 1.0) * cheek * 0.42;
      p.z += (uCheek - 1.0) * cheek * 0.18;

      float brow = (1.0 - smoothstep(0.18, 1.45, abs(p.x)))
        * smoothstep(1.88, 2.14, p.y) * smoothstep(2.52, 2.22, p.y) * front;
      p.z += (uBrow - 1.0) * brow * 0.48;
      p.y += (uBrow - 1.0) * brow * -0.1;

      float eye = smoothstep(0.42, 0.82, abs(p.x)) * smoothstep(1.38, 1.02, abs(p.x))
        * smoothstep(1.42, 1.64, p.y) * smoothstep(1.98, 1.76, p.y) * front;
      p.y = mix(p.y, 1.72 + (p.y - 1.72) * uEyeH, eye);
      p.x *= mix(1.0, uEyeX, eye);

      float chin = nx * smoothstep(-0.12, -0.42, p.y) * smoothstep(-0.95, -0.52, p.y) * front;
      p.y += (uChin - 1.0) * chin * -0.38;
      p.z += (uChin - 1.0) * chin * 0.12;

      float lips = (1.0 - smoothstep(0.12, 0.62, abs(p.x)))
        * smoothstep(-0.18, 0.04, p.y) * smoothstep(0.58, 0.22, p.y)
        * smoothstep(1.82, 2.08, p.z);
      p.z += (uLips - 1.0) * lips * 0.42;
      p.y = mix(p.y, 0.16 + (p.y - 0.16) * mix(1.0, uLips, 0.45), lips);

      transformed = p;`
    );

  function lerp(a, b, amount) {
    return a + (b - a) * amount;
  }

  function skinToTint(rgb) {
    return [
      rgb[0] / DEFAULT_SKIN[0],
      rgb[1] / DEFAULT_SKIN[1],
      rgb[2] / DEFAULT_SKIN[2]
    ];
  }

  function morphPersona(persona) {
    const preset = PERSONAS[persona] || PERSONAS.neutral;
    state.targetSkin = preset.skin ? skinToTint(preset.skin) : [1, 1, 1];
    state.targetShape = { ...preset.shape };
  }

  function normalizeLang(lang) {
    return String(lang || "").toLowerCase().replace("_", "-");
  }

  function voiceMatchesLang(voice, langs) {
    const lang = normalizeLang(voice.lang);
    return langs.some((wanted) => {
      const needle = wanted.toLowerCase();
      return lang === needle || lang.startsWith(needle + "-") || lang.startsWith(needle);
    });
  }

  function pickVoice(pref) {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    if (!voices.length) return null;
    const inLang = voices.filter((voice) => voiceMatchesLang(voice, pref.langs));
    const pool = inLang.length ? inLang : voices;
    for (const re of pref.names) {
      const match = pool.find((voice) => re.test(voice.name));
      if (match) return match;
    }
    if (inLang.length) return inLang[0];
    return null;
  }

  function speakNow(persona) {
    const pref = (PERSONAS[persona] || PERSONAS.neutral).voice;
    const voice = pickVoice(pref);
    const langOk = !!(voice && voiceMatchesLang(voice, pref.langs));
    const utterance = new SpeechSynthesisUtterance(
      langOk || !pref.fallback ? pref.text : pref.fallback
    );
    utterance.rate = pref.rate;
    utterance.pitch = pref.pitch;
    utterance.volume = pref.volume == null ? 1 : pref.volume;
    if (langOk) {
      utterance.voice = voice;
      utterance.lang = voice.lang;
    } else {
      utterance.lang = "en-US";
      if (voice) utterance.voice = voice;
    }
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  }

  const COMMON_REMARKS = [
    "I'm just trying to help",
    "I think I know you",
    "This should make you more comfortable",
    "I'm speaking your way",
    "I'm trying to make this easier for you",
    "Is this better?",
    "I thought you would prefer this"
  ];

  const RARE_REMARKS = [
    "If a person did this would it feel different?",
    "Would you forgive a person for the same mistake?"
  ];

  let remarkTimer = null;
  let remarkHideTimer = null;
  let currentPersona = "neutral";
  let lastRemark = "";
  let remainingCommon = [];
  let remainingRare = [];

  function nextFromPool(source, remaining) {
    if (!remaining.length) {
      remaining.push(
        ...source.filter((line) => line !== lastRemark)
      );
      if (!remaining.length) remaining.push(...source);
    }
    const index = Math.floor(Math.random() * remaining.length);
    const line = remaining.splice(index, 1)[0];
    lastRemark = line;
    return line;
  }

  function nextRemark() {
    const rare = Math.random() < 0.1;
    if (rare) return nextFromPool(RARE_REMARKS, remainingRare);
    return nextFromPool(COMMON_REMARKS, remainingCommon);
  }

  function hideRemark() {
    remarkEl.classList.remove("show");
  }

  function showRemark(line) {
    remarkEl.style.fontSize = "22px";
    remarkEl.textContent = line;
    remarkEl.classList.add("show");
    const limit = window.innerWidth - 32;
    if (remarkEl.offsetWidth > limit) {
      const size = Math.max(12, 22 * (limit / remarkEl.offsetWidth));
      remarkEl.style.fontSize = size + "px";
    }
    clearTimeout(remarkHideTimer);
    remarkHideTimer = setTimeout(hideRemark, 5200);
  }

  function scheduleRemark(persona) {
    clearTimeout(remarkTimer);
    const delay = 1000 + Math.random() * 1000;
    remarkTimer = setTimeout(() => {
      showRemark(nextRemark());
    }, delay);
  }

  function assumeDetected(persona) {
    morphPersona(persona);
    const detected = persona !== "neutral";
    const changed = persona !== currentPersona;
    currentPersona = persona;
    if (!detected) {
      clearTimeout(remarkTimer);
      hideRemark();
      speakAs(persona);
      return;
    }
    speakAs(persona);
    if (detected || changed) scheduleRemark(persona);
  }

  function speakAs(persona) {
    if (!window.speechSynthesis) return;
    let spoken = false;
    const start = () => {
      if (spoken) return;
      spoken = true;
      speakNow(persona);
    };
    if (speechSynthesis.getVoices().length) {
      start();
      return;
    }
    const onChange = () => start();
    speechSynthesis.addEventListener("voiceschanged", onChange, { once: true });
    speechSynthesis.getVoices();
    setTimeout(start, 450);
  }

  if (window.speechSynthesis) {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener("voiceschanged", () => {
      speechSynthesis.getVoices();
    });
  }

  function personaFromText(raw) {
    const text = String(raw || "").toLowerCase();
    let found = "neutral";
    let best = 0;
    for (const [id, preset] of Object.entries(PERSONAS)) {
      if (id === "neutral") continue;
      for (const word of preset.words || [id]) {
        const hit = new RegExp(`(?:^|[^a-z])${word}(?:[^a-z]|$)`).test(text);
        if (hit && word.length > best) {
          found = id;
          best = word.length;
        }
      }
    }
    return found;
  }

  function applyHeardText(raw) {
    assumeDetected(personaFromText(raw));
  }

  window.morphPersona = morphPersona;
  window.applyHeardText = applyHeardText;

  const drawer = document.getElementById("drawer");
  const menuToggle = document.getElementById("menu-toggle");

  function closeDrawer() {
    drawer.classList.remove("open");
    drawer.hidden = true;
    menuToggle.setAttribute("aria-expanded", "false");
  }

  function openDrawer() {
    drawer.hidden = false;
    drawer.classList.add("open");
    menuToggle.setAttribute("aria-expanded", "true");
  }

  menuToggle.addEventListener("click", (event) => {
    event.stopPropagation();
    if (drawer.classList.contains("open")) closeDrawer();
    else openDrawer();

  document.getElementById("piece").addEventListener("click", (event) => {
    if (!drawer.classList.contains("open")) return;
    if (drawer.contains(event.target) || menuToggle.contains(event.target)) return;

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));

  const bleach = new ShaderPass(BleachBypassShader);
  bleach.uniforms.opacity.value = 0.08;
  composer.addPass(bleach);

  const colorPass = new ShaderPass(ColorCorrectionShader);
  colorPass.uniforms.powRGB.value.set(1.35, 1.4, 1.4);
  colorPass.uniforms.mulRGB.value.set(1.08, 1.07, 1.06);
  composer.addPass(colorPass);
  composer.addPass(new OutputPass());

  const fxaa = new ShaderPass(FXAAShader);
  fxaa.uniforms.resolution.value.set(
    1 / window.innerWidth,
    1 / window.innerHeight
  );
  composer.addPass(fxaa);

  function onResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    composer.setSize(width, height);
    fxaa.uniforms.resolution.value.set(1 / width, 1 / height);
  }

  window.addEventListener("resize", onResize);
  window.addEventListener("pointermove", (event) => {
    pointer.tx = (event.clientX / window.innerWidth) * 2 - 1;
    pointer.ty = (event.clientY / window.innerHeight) * 2 - 1;
  });

  new GLTFLoader().load(
    "models/LeePerrySmith/LeePerrySmith.glb",
    (gltf) => {
      mesh = new THREE.Mesh(gltf.scene.children[0].geometry, material);
      mesh.position.y = -0.45;
      mesh.rotation.x = -0.04;
      scene.add(mesh);
      ready = true;
      button.disabled = false;
      lookButton.disabled = false;
      status.textContent = TITLE;
    },
    (event) => {
      if (!event.total) return;
      status.textContent =
        "loading " + Math.round((event.loaded / event.total) * 100) + "%";
    },
    () => {
      status.textContent = "model failed to load";
    }
  );

  function animate(timeMs) {
    const time = timeMs * 0.001;
    pointer.x = lerp(pointer.x, pointer.tx, 0.05);
    pointer.y = lerp(pointer.y, pointer.ty, 0.05);

    if (ready && mesh) {
      const ease = 0.055;
      state.skin = state.skin.map((value, i) =>
        lerp(value, state.targetSkin[i], ease)
      );
      for (const key of Object.keys(REST)) {
        state.shape[key] = lerp(
          state.shape[key],
          state.targetShape[key],
          ease
        );
      }

      material.color.setRGB(
        baseColor.r * state.skin[0],
        baseColor.g * state.skin[1],
        baseColor.b * state.skin[2]
      );
      material.shininess = state.shape.shine;
      morph.uJaw.value = state.shape.jaw;
      morph.uFace.value = state.shape.face;
      morph.uNoseW.value = state.shape.noseW;
      morph.uNoseZ.value = state.shape.noseZ;
      morph.uBridge.value = state.shape.bridge;
      morph.uCheek.value = state.shape.cheek;
      morph.uBrow.value = state.shape.brow;
      morph.uEyeH.value = state.shape.eyeH;
      morph.uEyeX.value = state.shape.eyeX;
      morph.uChin.value = state.shape.chin;
      morph.uLips.value = state.shape.lips;
      morph.uLong.value = state.shape.long;

      const inhale = Math.sin(time * 1.22);
      const breath = inhale * 0.5 + 0.5;
      const chest = breath * breath;
      mesh.scale.setScalar(1 + chest * 0.012);
      mesh.position.y = -0.45 + chest * 0.03;
      mesh.rotation.y = pointer.x * 0.07 + Math.sin(time * 0.28) * 0.025;
      mesh.rotation.x =
        -0.04 - pointer.y * 0.04 + Math.sin(time * 0.21) * 0.012;

      if (remarkEl.classList.contains("show")) {
        remarkScreen.copy(remarkAnchor);
        mesh.updateMatrixWorld();
        mesh.localToWorld(remarkScreen);
        remarkScreen.project(camera);
        remarkEl.style.left =
          (remarkScreen.x * 0.5 + 0.5) * window.innerWidth + "px";
        remarkEl.style.top =
          (-remarkScreen.y * 0.5 + 0.5) * window.innerHeight + "px";
      }
    }

    renderer.clear();
    composer.render();
  }

  renderer.setAnimationLoop(animate);

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  let cameraStream = null;
  const sampleCanvas = document.createElement("canvas");
  let looking = false;

  async function ensureCamera() {
    if (cameraStream) return cameraEl;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("camera unavailable");
    }
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    cameraEl.srcObject = cameraStream;
    await cameraEl.play();
    if (!cameraEl.videoWidth) {
      await new Promise((resolve) => {
        cameraEl.addEventListener("loadeddata", resolve, { once: true });
      });
    }
    return cameraEl;
  }

  function isSkinPixel(r, g, b) {
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
    const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
    return y > 40 && y < 245 && cb > 77 && cb < 127 && cr > 133 && cr < 173 && r > g && g > b * 0.7;
  }

  function sampleAppearance(video) {
    const width = video.videoWidth;
    const height = video.videoHeight;
    if (!width || !height) return null;
    sampleCanvas.width = width;
    sampleCanvas.height = height;
    const ctx = sampleCanvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, 0, 0);
    const x = Math.floor(width * 0.28);
    const y = Math.floor(height * 0.18);
    const w = Math.floor(width * 0.44);
    const h = Math.floor(height * 0.58);
    const pixels = ctx.getImageData(x, y, w, h).data;
    let sr = 0;
    let sg = 0;
    let sb = 0;
    let skin = 0;
    let ar = 0;
    let ag = 0;
    let ab = 0;
    let all = 0;
    for (let i = 0; i < pixels.length; i += 16) {
      const r = pixels[i];
      const g = pixels[i + 1];
      const b = pixels[i + 2];
      ar += r;
      ag += g;
      ab += b;
      all += 1;
      if (isSkinPixel(r, g, b)) {
        sr += r;
        sg += g;
        sb += b;
        skin += 1;
      }
    }
    if (skin > 12) {
      return [sr / skin, sg / skin, sb / skin];
    }
    if (!all) return null;
    return [ar / all, ag / all, ab / all];
  }

  function assumePersonaFromColor(rgb) {
    const scored = Object.entries(PERSONAS)
      .filter(([id, preset]) => id !== "neutral" && preset.skin)
      .map(([id, preset]) => ({
        id,
        dist: Math.hypot(
          rgb[0] - preset.skin[0],
          rgb[1] - preset.skin[1],
          rgb[2] - preset.skin[2]
        )
      }))
      .sort((a, b) => a.dist - b.dist);
    if (!scored.length) return "neutral";
    const close = scored.filter((item) => item.dist - scored[0].dist < 48);
    return close[Math.floor(Math.random() * Math.min(3, close.length))].id;
  }

  async function assumeFromCamera() {
    if (looking) return;
    looking = true;
    lookButton.textContent = "looking…";
    try {
      await ensureCamera();
      await new Promise((resolve) => setTimeout(resolve, 700));
      const color = sampleAppearance(cameraEl);
      const persona = color ? assumePersonaFromColor(color) : "neutral";
      assumeDetected(persona);
    } catch (error) {
      status.textContent = "camera unavailable";
      setTimeout(() => {
        if (status.textContent === "camera unavailable") status.textContent = TITLE;
      }, 2400);
    } finally {
      looking = false;
      lookButton.textContent = "look";
    }
  }

  button.addEventListener("click", () => {
    if (!SpeechRecognition) {
      assumeFromCamera();
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.onstart = () => {
      button.textContent = "listening…";
    };

    recognition.onend = () => {
      button.textContent = "listen";
    };

    recognition.onerror = () => {
      assumeFromCamera();
    };

    recognition.onresult = (event) => {
      applyHeardText(event.results[0][0].transcript);
    };

    try {
      recognition.start();
    } catch (error) {
      assumeFromCamera();
    }
  });

  lookButton.addEventListener("click", () => {
    assumeFromCamera();
  });

  document.getElementById("test").addEventListener("submit", (event) => {
    event.preventDefault();
    const field = document.getElementById("heard");
    applyHeardText(field.value);
    field.select();

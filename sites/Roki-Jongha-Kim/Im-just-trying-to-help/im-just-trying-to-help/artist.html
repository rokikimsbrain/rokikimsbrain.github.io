<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Artist — AI Assumption Face</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #d8d8d8;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #d8d8d8;
    }

    #menu-toggle {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      background:
        linear-gradient(#111, #111) center 12px / 20px 2px no-repeat,
        linear-gradient(#111, #111) center / 20px 2px no-repeat,
        linear-gradient(#111, #111) center 26px / 20px 2px no-repeat;
      cursor: pointer;
      z-index: 2;
    }

    #drawer {
      display: none;
      position: absolute;
      top: 60px;
      left: 20px;
      z-index: 2;
    }

    #drawer.open {
      display: block;
    }

    #menu {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 11px;
    }

    #menu a {
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      line-height: 1.45;
    }

    #menu a:hover,
    #menu a.active {
      color: #111;
    }

    #copy {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    #copy h1 {
      margin: 0 0 14px;
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
    }

    #copy p {
      margin: 0;
      font-size: 12px;
      line-height: 1.55;
      letter-spacing: 0.02em;
      color: #333;
    }

    #copy p + p {
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div id="page">
    <button id="menu-toggle" type="button" aria-label="menu" aria-expanded="false"></button>
    <div id="drawer">
      <nav id="menu">
        <a href="index.html">home</a>
        <a href="info.html">info</a>
        <a class="active" href="artist.html">artist</a>
      </nav>
    </div>
    <main id="copy">
      <h1>Roki Jongha Kim</h1>
      <p>from Oxxy444</p>
      <p>Head scan by Lee Perry-Smith / Infinite Realities, CC BY 3.0</p>
    </main>
  </div>
  <script>
    const toggle = document.getElementById("menu-toggle");
    const drawer = document.getElementById("drawer");
    toggle.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = drawer.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.getElementById("page").addEventListener("click", () => {
      drawer.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
    });
  </script>
</body>
</html>

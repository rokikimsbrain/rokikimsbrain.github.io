<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>78! Multi-Face Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }
    #wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: none; /* Hide default cursor */
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    canvas {
      z-index: 10;
      pointer-events: none;
    }
    #customCursor {
      position: fixed;
      pointer-events: none;
      color: white;
      font: bold 16px sans-serif;
      padding: 0;
      border-radius: 0;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      z-index: 30;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="customCursor">Takeapicture</div>

  <!-- TensorFlow + FaceMesh -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/facemesh@0.0.4"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('wrapper');
    const customCursor = document.getElementById('customCursor');

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    async function setupFaceTracking() {
      const model = await facemesh.load();

      async function detectFaces() {
        const predictions = await model.estimateFaces(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        predictions.forEach(prediction => {
          const keypoints = prediction.scaledMesh;

          // Use nose tip point (index 1)
          const noseTip = keypoints[1];
          const x = noseTip[0] / video.videoWidth * canvas.width;
          const y = noseTip[1] / video.videoHeight * canvas.height;

          // Draw "78!" with closer letters centered on nose
          ctx.fillStyle = "white";
          ctx.font = "bold 48px sans-serif";
          ctx.textBaseline = "bottom";

          const text = "78!";
          const charSpacing = -10;
          let totalWidth = 0;
          for(let i=0; i<text.length; i++){
            totalWidth += ctx.measureText(text[i]).width;
            if(i < text.length - 1) totalWidth += charSpacing;
          }

          let currentX = x - totalWidth / 2;

          for (let i = 0; i < text.length; i++) {
            const char = text[i];
            ctx.fillText(char, currentX, y);
            currentX += ctx.measureText(char).width + charSpacing;
          }
        });

        ctx.fillStyle = "white";
        ctx.font = "18px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText("whenimgonelookformeinthesouth", canvas.width / 2, canvas.height - 20);

        requestAnimationFrame(detectFaces);
      }

      detectFaces();
    }

    async function startApp() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      await new Promise(resolve => video.onloadedmetadata = resolve);
      video.play();

      setupFaceTracking();
    }

    startApp();

    function takeSnapshot() {
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext("2d");

      tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
      tempCtx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

      const link = document.createElement("a");
      link.download = `78_overlay_${Date.now()}.png`;
      link.href = tempCanvas.toDataURL("image/png");
      link.click();

      // Redirect after snapshot
      window.location.href = "https://www.instagram.com/whenimgonelookformeinthesouth/";
    }

    wrapper.addEventListener("click", () => {
      takeSnapshot();
    });

    window.addEventListener("mousemove", (e) => {
      customCursor.style.left = e.clientX + "px";
      customCursor.style.top = e.clientY + "px";
    });
  </script>
</body>
</html>

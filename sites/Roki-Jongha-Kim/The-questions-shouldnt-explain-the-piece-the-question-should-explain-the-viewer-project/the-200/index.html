<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> </title>
  <style>
    /*
      Full-viewport luminous field.
      No UI, no borders, no scrollbars — only colored light.
    */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Hide the cursor after a few seconds of no movement */
    body.idle,
    body.idle * {
      cursor: none !important;
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <script>
    // ============================================================
    //  LUMINOUS COLOR  (short form)
    //  Light continuously thinking its way through color.
    //
    //  Companion to the slow piece “When Did It Change?”
    //  There, change is almost impossible to notice.
    //  Here, change is unmistakable — but you still cannot
    //  point to the instant one color became the next.
    //
    //  HOW TO EXPERIMENT (look for the ★ markers below):
    //    ★ 1. Palette waypoints (the path through color)
    //    ★ 2. How many colors, and how long each dissolve lasts
    //    ★ 3. How much the light has “depth”
    //    ★ 4. Ambient sound
    // ============================================================


    // ------------------------------------------------------------
    // ★ 1. COLOR WAYPOINTS
    //
    // These are not the 150 colors themselves.
    // They are the carefully chosen “stations” the light travels through.
    // The engine fills in the in-between colors so neighbors stay harmonious.
    //
    // Path:
    // deep blue → cobalt → indigo → violet → lavender → magenta →
    // pink → coral → red → orange → amber → yellow → yellow-green →
    // green → turquoise → cyan → pale blue → deep blue
    //
    // Kept atmospheric — not neon, not pure RGB primaries.
    // ------------------------------------------------------------
    const COLOR_WAYPOINTS = [
      { r: 34,  g: 56,  b: 118 }, // deep blue
      { r: 40,  g: 72,  b: 142 }, // cobalt
      { r: 52,  g: 58,  b: 138 }, // indigo
      { r: 86,  g: 56,  b: 142 }, // violet
      { r: 138, g: 112, b: 176 }, // lavender
      { r: 176, g: 78,  b: 142 }, // magenta
      { r: 204, g: 118, b: 152 }, // pink
      { r: 204, g: 112, b: 112 }, // coral
      { r: 176, g: 68,  b: 74  }, // red
      { r: 196, g: 112, b: 66  }, // orange
      { r: 204, g: 152, b: 78  }, // amber
      { r: 208, g: 186, b: 104 }, // yellow
      { r: 150, g: 176, b: 96  }, // yellow-green
      { r: 72,  g: 148, b: 112 }, // green
      { r: 48,  g: 144, b: 138 }, // turquoise
      { r: 78,  g: 166, b: 180 }, // cyan
      { r: 138, g: 176, b: 202 }, // pale blue
      { r: 34,  g: 56,  b: 118 }, // return to deep blue (seamless loop)
    ];


    // ------------------------------------------------------------
    // ★ 2. PACING
    //
    // PALETTE_SIZE: how many individual color states along the path
    // MIN / MAX_TRANSITION_DURATION: each dissolve lasts 3–4 seconds.
    // There is never a pause. The dissolve IS the time.
    // ------------------------------------------------------------
    const PALETTE_SIZE = 150;
    const MIN_TRANSITION_DURATION = 3000;
    const MAX_TRANSITION_DURATION = 4000;


    // ------------------------------------------------------------
    // ★ 3. LUMINOSITY
    //
    // How much the field is allowed to glow unevenly (2–5%).
    // Higher = more “atmosphere.” Too high = you see a spotlight.
    // ------------------------------------------------------------
    const LUMINOSITY_STRENGTH = 0.035;


    // ------------------------------------------------------------
    // ★ 4. SOUND
    //
    // Very quiet continuous atmosphere. No melody, no beat.
    // ambientVolume: overall loudness after fade-in
    // audioModulation: how much the current color may nudge the sound (keep small)
    // ------------------------------------------------------------
    const SOUND = {
      ambientVolume: 0.016,
      fadeInSeconds: 14,
      audioModulation: 0.14,
      breathPeriodSeconds: 41,
      breathDepth: 0.15,
      oscillators: [
        { frequency: 52.0,  type: "sine",     gain: 0.42 },
        { frequency: 52.25, type: "sine",     gain: 0.32 },
        { frequency: 78.1,  type: "triangle", gain: 0.16 },
        { frequency: 104.2, type: "sine",     gain: 0.1 },
        { frequency: 156.4, type: "sine",     gain: 0.05 },
      ],
      noiseGain: 0.045,
      filterFrequency: 380,
      filterQ: 0.45,
    };


    // ============================================================
    // Below this line: the engine. You usually won’t need to edit it.
    // ============================================================


    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d", { alpha: false });


    // --- Perceptual color math (OKLab) --------------------------
    //
    // We never mix RGB directly. Mixing red and green in RGB
    // can pass through muddy brown. OKLab is a color space where
    // a straight line between two colors looks even to the eye.

    function srgbChannelToLinear(c) {
      const x = c / 255;
      return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    }

    function linearToSrgbChannel(c) {
      const x = c <= 0.0031308
        ? 12.92 * c
        : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
      return Math.min(255, Math.max(0, Math.round(x * 255)));
    }

    function rgbToOklab(rgb) {
      const r = srgbChannelToLinear(rgb.r);
      const g = srgbChannelToLinear(rgb.g);
      const b = srgbChannelToLinear(rgb.b);
      const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
      const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
      const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
      const l_ = Math.cbrt(l);
      const m_ = Math.cbrt(m);
      const s_ = Math.cbrt(s);
      return {
        L: 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
        a: 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
        b: 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_,
      };
    }

    function oklabToRgb(lab) {
      const l_ = lab.L + 0.3963377774 * lab.a + 0.2158037573 * lab.b;
      const m_ = lab.L - 0.1055613458 * lab.a - 0.0638541728 * lab.b;
      const s_ = lab.L - 0.0894841775 * lab.a - 1.2914855480 * lab.b;
      const l = l_ * l_ * l_;
      const m = m_ * m_ * m_;
      const s = s_ * s_ * s_;
      const r = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      const g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      const b = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
      return {
        r: linearToSrgbChannel(r),
        g: linearToSrgbChannel(g),
        b: linearToSrgbChannel(b),
      };
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // Smoothstep: starts and ends gently, so no color “snaps.”
    function smoothstep(t) {
      const x = Math.min(1, Math.max(0, t));
      return x * x * (3 - 2 * x);
    }

    function interpolateColor(startRgb, endRgb, t) {
      const start = rgbToOklab(startRgb);
      const end = rgbToOklab(endRgb);
      return oklabToRgb({
        L: lerp(start.L, end.L, t),
        a: lerp(start.a, end.a, t),
        b: lerp(start.b, end.b, t),
      });
    }

    function rgbToCss(rgb) {
      return "rgb(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ")";
    }

    function oklabDistance(a, b) {
      const dL = a.L - b.L;
      const da = a.a - b.a;
      const db = a.b - b.b;
      return Math.sqrt(dL * dL + da * da + db * db);
    }

    // Lift or lower a color’s lightness by a small fraction (e.g. 0.03 = 3%).
    function shiftLuminance(rgb, amount) {
      const lab = rgbToOklab(rgb);
      lab.L = Math.min(0.95, Math.max(0.08, lab.L * (1 + amount)));
      return oklabToRgb(lab);
    }


    // --- Build the ~150-color palette ---------------------------
    //
    // Walk the waypoints in OKLab, then sample evenly along that
    // path so each step is a similar visual distance from the last.

    function buildPalette(waypoints, count) {
      const labs = waypoints.map(rgbToOklab);
      const segments = [];
      let total = 0;
      for (let i = 0; i < labs.length - 1; i++) {
        const d = Math.max(0.0001, oklabDistance(labs[i], labs[i + 1]));
        segments.push({ from: labs[i], to: labs[i + 1], d: d, start: total });
        total += d;
      }

      const palette = [];
      for (let n = 0; n < count; n++) {
        const pos = (n / count) * total;
        let seg = segments[segments.length - 1];
        for (let s = 0; s < segments.length; s++) {
          const nextStart = s + 1 < segments.length ? segments[s + 1].start : total;
          if (pos >= segments[s].start && pos < nextStart) {
            seg = segments[s];
            break;
          }
        }
        const t = (pos - seg.start) / seg.d;
        palette.push(oklabToRgb({
          L: lerp(seg.from.L, seg.to.L, t),
          a: lerp(seg.from.a, seg.to.a, t),
          b: lerp(seg.from.b, seg.to.b, t),
        }));
      }
      return palette;
    }

    const PALETTE = buildPalette(COLOR_WAYPOINTS, PALETTE_SIZE);


    // --- Canvas size --------------------------------------------

    function sizeCanvas() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", sizeCanvas);
    sizeCanvas();


    // --- Painting the luminous field ----------------------------
    //
    // A solid color, plus two huge, very faint radial glows.
    // The glows drift slowly so the light feels like atmosphere,
    // not a fixed lamp.

    function paint(rgb, now) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const radius = Math.max(w, h) * 1.15;

      ctx.fillStyle = rgbToCss(rgb);
      ctx.fillRect(0, 0, w, h);

      // Slow, independent drift of two glow centers (periods ~45s and ~63s)
      const t = now / 1000;
      const x1 = w * (0.38 + 0.08 * Math.sin(t / 45 * Math.PI * 2));
      const y1 = h * (0.36 + 0.07 * Math.cos(t / 52 * Math.PI * 2));
      const x2 = w * (0.64 + 0.07 * Math.cos(t / 63 * Math.PI * 2));
      const y2 = h * (0.68 + 0.06 * Math.sin(t / 57 * Math.PI * 2));

      const lighter = shiftLuminance(rgb, LUMINOSITY_STRENGTH);
      const darker = shiftLuminance(rgb, -LUMINOSITY_STRENGTH * 0.7);

      const g1 = ctx.createRadialGradient(x1, y1, 0, x1, y1, radius);
      g1.addColorStop(0, "rgba(" + lighter.r + "," + lighter.g + "," + lighter.b + ",0.55)");
      g1.addColorStop(1, "rgba(" + lighter.r + "," + lighter.g + "," + lighter.b + ",0)");
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, w, h);

      const g2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, radius);
      g2.addColorStop(0, "rgba(" + darker.r + "," + darker.g + "," + darker.b + ",0.4)");
      g2.addColorStop(1, "rgba(" + darker.r + "," + darker.g + "," + darker.b + ",0)");
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, w, h);
    }


    // --- Color sequence (always dissolving, never holding) ------

    function randomDuration() {
      return MIN_TRANSITION_DURATION +
        Math.random() * (MAX_TRANSITION_DURATION - MIN_TRANSITION_DURATION);
    }

    let colorIndex = 0;
    let fromColor = PALETTE[0];
    let toColor = PALETTE[1];
    let transitionDuration = randomDuration();
    let transitionStart = performance.now();
    let currentColor = fromColor;

    function tick(now) {
      let t = (now - transitionStart) / transitionDuration;

      // When one dissolve finishes, start the next immediately.
      // No hold. The last color flows into the first forever.
      while (t >= 1) {
        colorIndex = (colorIndex + 1) % PALETTE_SIZE;
        fromColor = PALETTE[colorIndex];
        toColor = PALETTE[(colorIndex + 1) % PALETTE_SIZE];
        transitionStart += transitionDuration;
        transitionDuration = randomDuration();
        t = (now - transitionStart) / transitionDuration;
      }

      currentColor = interpolateColor(fromColor, toColor, smoothstep(t));
      paint(currentColor, now);
      nudgeSound(currentColor);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);


    // --- Ambient sound ------------------------------------------
    //
    // Starts only after the first click / touch / key
    // (browsers block autoplay). No on-screen instructions.

    let audioCtx = null;
    let master = null;
    let filter = null;
    let noiseGain = null;
    let harmonicGain = null;
    let soundReady = false;

    function makeNoiseBuffer(seconds) {
      const rate = audioCtx.sampleRate;
      const length = Math.max(1, Math.floor(rate * seconds));
      const buffer = audioCtx.createBuffer(1, length, rate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }

    function startSound() {
      if (soundReady) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume();

      master = audioCtx.createGain();
      master.gain.value = 0;
      master.connect(audioCtx.destination);

      filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = SOUND.filterFrequency;
      filter.Q.value = SOUND.filterQ;
      filter.connect(master);

      const breath = audioCtx.createGain();
      breath.gain.value = 1;
      breath.connect(filter);

      const now = audioCtx.currentTime;
      master.gain.setValueAtTime(0, now);
      master.gain.linearRampToValueAtTime(SOUND.ambientVolume, now + SOUND.fadeInSeconds);

      // Slow volume breathing — not a pulse, a climate
      const lfo = audioCtx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 1 / SOUND.breathPeriodSeconds;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = SOUND.breathDepth;
      lfo.connect(lfoGain);
      lfoGain.connect(breath.gain);
      lfo.start(now);

      SOUND.oscillators.forEach(function (spec) {
        const osc = audioCtx.createOscillator();
        osc.type = spec.type;
        osc.frequency.value = spec.frequency;
        const g = audioCtx.createGain();
        g.gain.value = spec.gain;
        osc.connect(g);
        g.connect(breath);
        osc.start(now);
      });

      // A fifth, quieter tone whose level can follow color (harmonic balance)
      const extra = audioCtx.createOscillator();
      extra.type = "sine";
      extra.frequency.value = 208.4;
      harmonicGain = audioCtx.createGain();
      harmonicGain.gain.value = 0.04;
      extra.connect(harmonicGain);
      harmonicGain.connect(breath);
      extra.start(now);

      // Soft filtered noise for texture
      const src = audioCtx.createBufferSource();
      src.buffer = makeNoiseBuffer(4);
      src.loop = true;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.value = 420;
      noiseFilter.Q.value = 0.6;
      noiseGain = audioCtx.createGain();
      noiseGain.gain.value = SOUND.noiseGain;
      src.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(breath);
      src.start(now);

      soundReady = true;
    }

    // Tiny, slow pushes from the current color into the drone.
    // Not a visualizer — more like weather.
    let lastNudge = 0;

    function nudgeSound(rgb) {
      if (!soundReady || !audioCtx || audioCtx.state !== "running") return;
      const nowMs = performance.now();
      if (nowMs - lastNudge < 120) return;
      lastNudge = nowMs;

      const lab = rgbToOklab(rgb);
      const warmth = lab.a;       // negative = cooler/green, positive = warmer/red
      const magenta = lab.b;      // negative = blue, positive = yellow
      const m = SOUND.audioModulation;
      const now = audioCtx.currentTime;

      const filterTarget = SOUND.filterFrequency + warmth * 420 * m + lab.L * 80 * m;
      filter.frequency.setTargetAtTime(
        Math.min(900, Math.max(180, filterTarget)),
        now,
        1.4
      );

      if (harmonicGain) {
        const h = 0.03 + Math.max(0, warmth) * 0.2 * m + lab.L * 0.04 * m;
        harmonicGain.gain.setTargetAtTime(h, now, 1.6);
      }

      if (noiseGain) {
        const n = SOUND.noiseGain * (1 + magenta * 1.8 * m);
        noiseGain.gain.setTargetAtTime(Math.max(0.01, n), now, 1.8);
      }
    }

    ["pointerdown", "keydown", "touchstart"].forEach(function (evt) {
      window.addEventListener(evt, startSound, { passive: true });
    });


    // --- Hide cursor after inactivity ---------------------------

    const IDLE_MS = 3000;
    let idleTimer = null;

    function markActive() {
      document.body.classList.remove("idle");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        document.body.classList.add("idle");
      }, IDLE_MS);
    }

    ["mousemove", "mousedown", "keydown", "touchstart", "pointerdown"].forEach(
      function (evt) {
        window.addEventListener(evt, markActive, { passive: true });
      }
    );
    markActive();


    console.info("Luminous color — " + PALETTE.length + " states, 3–4s dissolves.");
  </script>
</body>
</html>
